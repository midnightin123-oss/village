<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>프로젝트 빌리지 🎄</title>
<meta property="og:title" content="소녀들의 크리스마스 파티에 초대할게 💌">
<meta property="og:description" content="프로젝트 빌리지 · 12.19까지 매일 문 하나씩">
<meta property="og:image" content="https://midnightin123-oss.github.io/village/og.png"><meta property="og:url" content="https://midnightin123-oss.github.io/village/">
<style>
@font-face{font-family:'Galmuri11';src:url('fonts/Galmuri11.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Galmuri11';src:url('fonts/Galmuri11-Bold.woff2') format('woff2');font-weight:700}
:root{--ink:#4A2E1B;--brown:#5A3A22;--dark:#3E2716;--cream:#FBEFD5;--paper:#FFF8E6;--bg:#FBEDDB;--muted:#8A6A4E;--red:#D9483B;--yellow:#FFD45E;--green:#8CC63F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b1d12;font-family:'Galmuri11',monospace;color:var(--ink);overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#9DB06A;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.spr{position:absolute;transform:translate(-50%,-100%);pointer-events:none;-webkit-user-drag:none}
.shadow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:rgba(40,30,15,.22);pointer-events:none}
.pill{background:var(--cream);border:3px solid var(--brown);border-radius:999px;box-shadow:0 3px 0 var(--dark)}
.panel{background:var(--cream);border:4px solid var(--brown);border-radius:12px;box-shadow:0 4px 0 var(--dark),inset 0 0 0 3px var(--paper)}
.btn-g{background:var(--green);border:4px solid #3E5A1A;border-radius:999px;box-shadow:0 4px 0 #2C4212,inset 0 4px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.12);color:#fff;text-shadow:0 2px 0 #3E5A1A;font-weight:700;cursor:pointer}
.btn-g:active{transform:translateY(3px);box-shadow:0 1px 0 #2C4212}
.btn-g:disabled{filter:grayscale(.6) opacity(.7)}
.btn-c{background:var(--cream);border:3px solid var(--brown);border-radius:999px;box-shadow:0 3px 0 var(--dark),inset 0 3px 0 rgba(255,255,255,.6);font-weight:700;cursor:pointer}
.btn-c:active{transform:translateY(2px);box-shadow:0 1px 0 var(--dark)}
.small{font-size:10px;color:var(--muted)}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;z-index:30;pointer-events:none}
.hud>*{pointer-events:auto}
.dday{background:var(--red);color:#fff;border:3px solid #7A2018;border-radius:999px;font-weight:700;font-size:15px;padding:2px 9px;text-shadow:0 2px 0 #7A2018}
.coins{margin-left:auto;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 4px;font-weight:700;font-size:15px}
.coins img{width:26px;height:26px}
.testbar{position:absolute;left:10px;top:60px;z-index:30;background:#5A3A22;color:var(--yellow);border:3px solid var(--dark);border-radius:999px;font-size:10px;padding:3px 10px}
.tray{position:absolute;left:10px;right:10px;bottom:10px;height:86px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:30}
.tray button{border:none;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700}
.tray button img{width:50px;height:51px}
.prompt{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);z-index:31;font-size:14px;padding:9px 18px;white-space:nowrap;animation:pop .2s}
.prompt.lock{background:#E7DCCB;color:var(--muted);border-color:#8A6A4E;cursor:default}
@keyframes pop{from{transform:translateX(-50%) scale(.7)}}
.ava{position:absolute;pointer-events:none}
.ava .body{position:absolute;left:0;bottom:0;transform-origin:50% 100%}
.ava.walk .body{animation:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4%) rotate(-3deg)}75%{transform:translateY(-4%) rotate(3deg)}}
.ava.flip .stack{transform:scaleX(-1)}
.stack{position:relative}
.stack img{position:absolute;left:0;top:0;width:100%;-webkit-user-drag:none}
.nametag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:700;padding:0 6px;border-width:2px;box-shadow:0 2px 0 var(--dark)}
.ava.me .nametag{background:var(--yellow)}
.say{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--brown);border-radius:12px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 var(--dark)}
.emo{position:absolute;left:50%;width:34px;animation:floatup 1.6s forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px)}}
.joy{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:3px solid rgba(90,58,34,.6);background:rgba(251,239,213,.35);z-index:29;pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 var(--dark)}
.marker{position:absolute;width:22px;height:12px;margin:-6px 0 0 -11px;border-radius:50%;border:3px solid var(--yellow);animation:mk .8s ease-out forwards;pointer-events:none}
@keyframes mk{to{transform:scale(1.8);opacity:0}}
.sign{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;padding:1px 8px;white-space:nowrap;pointer-events:none}
.sign.open{background:var(--yellow)}
.sign.wood{background:#A87A4E;color:#FFF3DD;border-color:#5A3A22}
.glow{position:absolute;border-radius:50%;background:radial-gradient(rgba(255,212,94,.55),rgba(255,212,94,0) 70%);pointer-events:none;transform:translate(-50%,-50%);animation:gl 1.6s ease-in-out infinite}
@keyframes gl{50%{opacity:.45}}
.veil{position:absolute;inset:0;background:rgba(43,29,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:88%;overflow:auto;margin:0 8px 10px;padding:16px}
.sheet h2{margin:0 0 8px;font-size:17px}
.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:60;background:var(--brown);color:var(--cream);border:3px solid var(--dark);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;white-space:nowrap;animation:pop .2s}
/* advent */
.adv{position:relative;margin:26px 2px 0;padding:46px 12px 14px;border-radius:18px 18px 14px 14px;background:#A8222A;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 10px,transparent 10px 20px);border:6px solid #E2B13C;box-shadow:0 0 0 4px #7A4A1A,0 6px 0 4px #3E2716,inset 0 0 0 3px #F6D27A}
.adv .garland{position:absolute;left:-14px;right:-14px;top:-18px;height:30px;border-radius:16px;background:#2F6B43;box-shadow:inset 0 -6px 0 #1F4D2F,0 3px 0 #173A23;background-image:radial-gradient(circle at 8px 8px,#3F8A55 4px,transparent 5px);background-size:16px 14px}
.adv .bulbs{position:absolute;left:0;right:0;top:-6px;display:flex;justify-content:space-around;pointer-events:none}
.adv .bulbs i{width:10px;height:13px;border-radius:50% 50% 45% 45%;border:2px solid #3E2716;animation:twk 1.4s infinite}
.adv .bulbs i:nth-child(4n+1){background:#FFD45E}.adv .bulbs i:nth-child(4n+2){background:#FF6B6B;animation-delay:.35s}.adv .bulbs i:nth-child(4n+3){background:#7FD3FF;animation-delay:.7s}.adv .bulbs i:nth-child(4n){background:#9BE07A;animation-delay:1.05s}
@keyframes twk{50%{filter:brightness(.55)}}
.adv .star{position:absolute;left:50%;top:-52px;width:46px;height:46px;margin-left:-23px;background:#FFD45E;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 6px #FFE9A0);animation:twk 2.4s infinite}
.adv .banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#FFF3DD;border:3px solid #7A4A1A;padding:3px 16px;white-space:nowrap;text-align:center;font-weight:700;font-size:13px;color:#8E1E24;box-shadow:0 3px 0 #3E2716}
.adv .banner small{display:block;font-size:8px;letter-spacing:2px;color:#A86B3C}
.adv .banner::before,.adv .banner::after{content:'';position:absolute;top:6px;width:14px;height:18px;background:#E9D3A8;border:3px solid #7A4A1A;z-index:-1}
.adv .banner::before{left:-14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}.adv .banner::after{right:-14px;clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%)}
.adv .snowcap{position:absolute;left:6px;right:6px;top:-3px;height:8px;background:radial-gradient(circle at 10px 0,#fff 7px,transparent 8px);background-size:22px 8px;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:52px;gap:6px;position:relative}
.door{position:relative;border-radius:6px;perspective:400px;cursor:pointer;padding:0;border:none;background:#3A1A10;box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.door.w2{grid-column:span 2}
.door .in{position:absolute;inset:0;border-radius:6px;background:radial-gradient(#FFF6E0,#F2D9A8);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:8px;font-weight:700;line-height:1.1;color:#6A3A1A}
.door .in img{height:30px;max-width:90%}
.door .lid{position:absolute;inset:0;border-radius:6px;border:3px solid #3E2716;transform-origin:0 50%;transition:transform .8s cubic-bezier(.4,1.5,.5,1);display:flex;align-items:center;justify-content:center;color:#FFF6E0;font-weight:700;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.45);backface-visibility:hidden;overflow:hidden}
.door .lid::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3px;background:rgba(255,255,255,.28)}
.door .lid::after{content:'';position:absolute;top:50%;left:0;right:0;height:7px;margin-top:-3px;background:rgba(255,255,255,.28)}
.door .lid span{position:relative;z-index:1;background:inherit;padding:0 3px;border-radius:4px}
.door .lid small{position:absolute;right:4px;bottom:2px;font-size:7px;font-weight:400;opacity:.85;z-index:1}
.door .c0{background:#C8312F}.door .c1{background:#2E7D4F}.door .c2{background:#F2E2BE;color:#8E1E24;text-shadow:none}.door .c3{background:#D9A23C}.door .c4{background:#2B3F6B}
.door .c2 span{color:#8E1E24}
.door.opened .lid{transform:rotateY(-110deg)}
.door.ready .lid{animation:shake 1.2s infinite}
@keyframes shake{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}95%{transform:rotate(-2deg)}}
.door.ready::after{content:'';position:absolute;inset:-3px;border-radius:8px;box-shadow:0 0 10px 3px rgba(255,212,94,.9);pointer-events:none}
.door.locked .lid{filter:brightness(.82) saturate(.85)}
.door.today .lid{outline:3px solid #FFD45E;outline-offset:-6px}
.door.done .in::after{content:'★';position:absolute;right:3px;top:1px;color:#D9A23C;font-size:12px}
.bigdoor{grid-column:1/-1;height:64px;margin-top:4px}
.bigdoor .lid{background:#2E7D4F;font-size:14px;gap:6px}
.bigdoor .bow{position:absolute;left:50%;top:-14px;margin-left:-22px;width:44px;height:22px;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 25% 50%,#E04848 9px,transparent 10px),radial-gradient(ellipse at 75% 50%,#E04848 9px,transparent 10px),radial-gradient(circle at 50% 55%,#B8282C 5px,transparent 6px)}
.adv-detail{margin-top:12px}
/* creator */
.thumb{position:relative;width:40px;height:40px;padding:0;overflow:hidden;cursor:pointer;border-radius:10px;border:3px solid var(--brown);background:var(--paper);box-shadow:0 3px 0 var(--dark)}
.thumb.on{border-color:var(--red);background:#FFE8A3}
.swatch{width:36px;height:36px;border-radius:50%;padding:0;cursor:pointer;border:3px solid var(--brown);box-shadow:0 3px 0 var(--dark)}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--red)}
.chip{height:34px;padding:0 10px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;border:3px solid var(--brown);background:var(--cream);box-shadow:0 3px 0 var(--dark)}
.chip.on{background:var(--yellow)}
.row{display:flex;align-items:center;gap:8px}
.row>span{width:36px;flex-shrink:0;font-size:11px;color:var(--muted)}
.row>div{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
input.txt,textarea.txt,select.txt{font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:8px;padding:6px 8px;width:100%;outline:none}
.note{position:absolute;width:44px;min-height:34px;padding:3px;font-size:7px;line-height:1.25;border:2px solid var(--brown);box-shadow:0 2px 0 rgba(0,0,0,.3);overflow:hidden;word-break:break-all;pointer-events:none}
.note b{display:block;color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.shop button{position:relative;height:80px;border-radius:10px;border:3px solid var(--brown);background:var(--paper);box-shadow:0 3px 0 var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;font-size:10px}
.shop button img.it{max-width:42px;max-height:38px}
.shop button:disabled{opacity:.5}
.badge{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#7A4FA0;color:#fff;border:2px solid #4A2E60;border-radius:999px;font-size:9px;padding:1px 6px;white-space:nowrap}
.furn-sel{outline:3px dashed #3B78C9;outline-offset:3px;border-radius:6px}
.editbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:32;padding:12px;max-height:52%;overflow:auto}

/* v3 additions */
.wallitem{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.treeview{position:relative;width:100%;margin:0 auto;touch-action:none}
.treeview img.tree{display:block;width:100%;-webkit-user-drag:none}
.treeview .orn{position:absolute;transform:translate(-50%,-30%);width:9%;cursor:pointer;-webkit-user-drag:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.treeview .orn.mine{filter:drop-shadow(0 0 4px #FFD45E)}
.treeview .lights i{position:absolute;width:7px;height:7px;border-radius:50%;animation:twk 1.2s infinite;box-shadow:0 0 8px currentColor}
.inv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.inv button{width:46px;height:46px;border-radius:10px;border:3px solid var(--brown);background:var(--paper);box-shadow:0 3px 0 var(--dark);padding:3px;cursor:pointer}
.inv button img{max-width:100%;max-height:100%}
.inv button.on{border-color:var(--red);background:#FFE8A3}
.orntag{position:absolute;transform:translate(-50%,-140%);background:#fff;border:2px solid var(--brown);border-radius:8px;padding:1px 6px;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none;z-index:3}
.vorn{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.banner-bell{position:absolute;left:10px;right:10px;top:62px;z-index:45;display:flex;align-items:center;gap:8px;padding:8px 10px;animation:pop2 .3s}
@keyframes pop2{from{transform:translateY(-20px);opacity:0}}
.chatbox{position:absolute;left:8px;right:8px;bottom:8px;z-index:32;display:flex;flex-direction:column;padding:8px;max-height:44%}
.chatbox.min .msgs{display:none}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:2px 2px 6px;min-height:60px;max-height:150px}
.msg{max-width:80%;padding:4px 8px;border-radius:10px;font-size:12px;line-height:1.35;background:#fff;border:2px solid #D9C4A0;align-self:flex-start;word-break:break-all}
.msg b{display:block;font-size:9px;color:var(--muted)}
.msg.me{align-self:flex-end;background:#FFE58A;border-color:#E2B13C}
.msg.sys{align-self:center;background:transparent;border:none;color:var(--muted);font-size:10px}
.chatin{display:flex;gap:6px}
.chatin input{flex:1;font-size:14px;padding:6px 8px}
.tablepanel{position:absolute;left:8px;right:8px;z-index:33;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tablepanel button{font-size:12px;padding:6px 10px}
.glass{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.glass img{position:absolute;left:0;bottom:0;width:100%}
.anju{position:absolute;transform:translate(-50%,-60%);pointer-events:none}
.burst{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:22px;color:#fff;text-shadow:0 0 3px #D9483B,0 3px 0 #8E1E24;pointer-events:none;animation:burst 1.2s forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3)}30%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.pourbottle{position:absolute;transform-origin:50% 80%;pointer-events:none;animation:pour 1.1s forwards}
@keyframes pour{0%{transform:translate(-50%,-120%) rotate(0)}30%,75%{transform:translate(-20%,-130%) rotate(-115deg)}100%{transform:translate(-50%,-120%) rotate(0);opacity:0}}
.chalk{position:absolute;background:#2F4A3A;border:8px solid #8A5A34;border-radius:6px;box-shadow:inset 0 0 0 2px #24382C,0 4px 0 rgba(0,0,0,.25)}
.chalk .t{position:absolute;left:0;right:0;top:4px;text-align:center;color:#F4F1E6;font-size:11px;font-weight:700}
.tile-note{position:absolute;width:52px;min-height:38px;padding:3px;font-size:8px;line-height:1.25;border:2px solid var(--brown);box-shadow:0 2px 0 rgba(0,0,0,.3);overflow:hidden;word-break:break-all}
.tile-note b{display:block;color:var(--muted)}
.pubcount{background:#5A3A22;color:#FFD45E;border-color:#3E2716}
.aprop{position:absolute;pointer-events:none;image-rendering:pixelated;transform:translate(-50%,-100%)}
.stream{position:absolute;width:4px;background:linear-gradient(#FFE07A,#F5B02E);border-radius:2px;pointer-events:none;transform-origin:top}
.notice{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:60;background:#FFF8E7;border:3px solid #5A3A22;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;white-space:nowrap;animation:ndrop .35s ease-out}
.notice img{width:22px}
@keyframes ndrop{from{transform:translate(-50%,-40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.cele{position:relative;text-align:center;padding:6px 0 4px}
.cdoor{position:relative;width:150px;height:150px;margin:6px auto 10px;perspective:600px}
.cdoor .cin{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle,#FFF4C2,#F2C14E 70%);border:4px solid #7A1E1E;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cdoor .corn{width:70px;opacity:0;transform:scale(.2) translateY(30px);animation:ornup .7s 1s cubic-bezier(.3,1.6,.5,1) forwards}
.cdoor .clid{position:absolute;inset:0;border-radius:12px;background:#C8322D;border:4px solid #7A1E1E;transform-origin:left center;animation:dooropen 1s .3s ease-in forwards;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFE9A0;font-size:44px;font-weight:700;backface-visibility:hidden;box-shadow:inset 0 0 0 4px #E8574F}
.cdoor .clid small{font-size:13px}
.cdoor .clid:after{content:'';position:absolute;right:12px;top:50%;width:10px;height:10px;border-radius:50%;background:#FFD45E}
@keyframes dooropen{to{transform:rotateY(-115deg)}}
@keyframes ornup{to{opacity:1;transform:scale(1) translateY(0)}}
.spark{position:absolute;width:10px;height:10px;background:#FFD45E;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:spk 1.2s 1.2s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.cele h2{margin:4px 0}
.cele .reward{display:inline-flex;gap:8px;align-items:center;background:#FFF3D6;border:2px solid #E3B566;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;margin:6px 0 12px}
.cele .reward img{width:18px}
.ava.sit{margin-top:-14px}
.ava.sit .stack{clip-path:inset(0 0 19% 0)}
.anju{transform:translate(-50%,-100%)}
.ava.pose-type .body{animation:typebob .22s steps(2) infinite}
@keyframes typebob{0%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.ava.pose-dance .body{animation:dance .7s ease-in-out infinite}

.door .pend{position:absolute;right:2px;top:2px;width:15px;z-index:2;animation:twk 1s infinite}

.stampfx .card{width:120px;height:120px;border-radius:14px;background:radial-gradient(#FFF6E0,#F2D9A8);border:5px solid #7A1E1E;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}

@keyframes stampin{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
.stampfx .lbl{margin-top:10px;background:#FFF8E7;border:3px solid #5A3A22;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.hangbar{position:absolute;left:10px;right:10px;bottom:14px;z-index:40;padding:10px 12px}

.bgmbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;padding:0}
.adv .advsum{margin:12px 0 10px;flex-wrap:wrap}
.grid{grid-auto-rows:60px}
.door .st{font-size:8px}
.lapc{position:absolute;width:16px;height:14px;pointer-events:none}

.lapc i{position:absolute;display:block}
.lapc .lc-shut{left:2px;bottom:1px;width:11px;height:5px;background:linear-gradient(#E3E6EA,#B7BCC3);border:1px solid #4D5258;border-radius:1px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.lapc .lc-base{left:1px;bottom:1px;width:10px;height:5px;background:repeating-linear-gradient(90deg,#3C4148 0 1px,#8E949B 1px 2px);border:1px solid #4D5258;border-radius:1px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.lapc .lc-lid{left:10px;bottom:5px;width:4px;height:10px;transform-origin:50% 100%;background:linear-gradient(90deg,#8FD3FF,#4F9BDA 55%,#A9AEB4 56%,#C7CBD0);border:1px solid #3E434A;border-radius:1px;transform:skewY(-18deg);box-shadow:-3px 0 6px rgba(120,200,255,.6)}
.worktag.wtag{background:#2E7D4F;color:#fff}
.cheersask{position:absolute;left:50%;bottom:300px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:8px;padding:8px 12px;white-space:nowrap;animation:ndrop .3s ease-out}
.ava .nametag.working{background:#2E7D4F;color:#fff;border-color:#1F5A37}

.lapc{transform:scale(1.6)}
.lapc.flipx{transform:scale(-1.6,1.6)}

.hud .pill b{white-space:nowrap}
.sign{white-space:nowrap}

/* ===== OPENING ===== */
.op{position:absolute;inset:0;overflow:hidden;color:#FFF8E6;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:opIn .5s ease both}
@keyframes opIn{from{opacity:0}to{opacity:1}}
.op-sky{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 110%,#7A4A8C 0%,#3B2D6B 38%,#151B44 70%,#0B1030 100%)}
.op-sky::after{content:'';position:absolute;left:0;right:0;bottom:0;height:24%;background:url('video/arrival.jpg') center 62%/cover;opacity:.0}
.op-snow{position:absolute;inset:0;pointer-events:none}
.op-snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(30px,110vh,0)}}
.op-top{position:absolute;top:9%;text-align:center;z-index:2}
.op-kicker{font-size:11px;letter-spacing:.35em;color:#FFD45E;opacity:.9}
.op-hint{font-size:17px;font-weight:700;margin-top:10px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.op-hint.big{font-size:19px;margin-bottom:14px}
.op-tap{position:absolute;bottom:11%;font-size:13px;opacity:.85;animation:blink 1.4s ease-in-out infinite;z-index:2}
@keyframes blink{50%{opacity:.25}}
/* envelope */
.env{position:relative;width:min(78vw,320px);aspect-ratio:1.45;border:0;background:none;padding:0;cursor:pointer;z-index:2;animation:envFloat 3s ease-in-out infinite;perspective:900px}
@keyframes envFloat{50%{transform:translateY(-8px) rotate(-1deg)}}
.env-back,.env-front{position:absolute;inset:0;border-radius:6px}
.env-back{background:#B7322B;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.env-front{background:linear-gradient(180deg,#C93C33,#D4463C);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:3}
.env-front::after{content:'';position:absolute;inset:0;background:linear-gradient(32deg,transparent 49.6%,rgba(0,0,0,.12) 50%,transparent 51%),linear-gradient(-32deg,transparent 49.6%,rgba(0,0,0,.12) 50%,transparent 51%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:58%;background:#A82A24;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .7s cubic-bezier(.6,.1,.3,1),z-index 0s .35s;z-index:5}
.env-seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-30px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#E0A72E 60%,#9A6A12);color:#7A1C16;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:6;transition:opacity .3s,transform .3s}
.env-addr{position:absolute;left:8%;bottom:9%;z-index:4;text-align:left;font-size:10px;color:#FFE9D6;display:flex;flex-direction:column;gap:2px}
.env-addr b{font-size:13px}
.env-stamp{position:absolute;right:-180%;bottom:4px;width:30px;height:36px;background:#FFF8E6;color:#2E7D4F;border:2px dashed #C9A97E;display:flex;align-items:center;justify-content:center;font-size:18px}
.env-card,.env-ticket{position:absolute;left:7%;right:7%;top:8%;height:84%;background:#FFF8E6;border-radius:4px;z-index:2;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.env-card-in{position:absolute;inset:8px;border:2px solid #D9483B;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:#7A1C16;gap:4px}
.env-card-in b{letter-spacing:.2em;font-size:13px}.env-card-in span{font-size:11px}
.env-ticket{left:14%;right:14%;top:12%;height:34%;background:#FFD45E;z-index:2;display:flex;align-items:flex-start;justify-content:flex-end;padding:6px 10px;font-size:10px;font-weight:700;color:#5A3A22}
.env.open{animation:none}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .env-seal{opacity:0;transform:scale(1.6)}
.env.rise .env-card{transform:translateY(-62%)}
.env.rise .env-ticket{transform:translate(18%,-150%) rotate(9deg);transition-delay:.25s}
/* invitation */
.iv-wrap{position:relative;z-index:2;width:min(90vw,380px);max-height:100%;overflow-y:auto;padding:22px 0 26px;display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .6s ease,opacity .6s}
.iv-wrap.leave{transform:translateY(-30px) scale(.96);opacity:0}
.iv-card{position:relative;width:100%;background:#FFF8E6;color:#4A2E1B;border-radius:6px;padding:22px 20px 18px;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 6px #FFF8E6,inset 0 0 0 8px #D9483B,inset 0 0 0 11px #FFF8E6,inset 0 0 0 12px #2E7D4F;animation:ivUp .8s cubic-bezier(.2,.8,.2,1) both;text-align:center}
@keyframes ivUp{from{transform:translateY(70px) rotate(-2deg);opacity:0}}
.iv-deco{color:#D9483B;font-size:12px;letter-spacing:.4em}
.iv-kicker{font-size:10px;letter-spacing:.3em;color:#2E7D4F;margin-top:6px}
.iv-title{font-size:21px;line-height:1.45;margin:8px 0 10px;white-space:pre-line;color:#9A2A22}
.iv-body{font-size:12px;line-height:1.85;white-space:pre-line;margin:0 0 12px}
.iv-rows{border-top:2px dashed #E3B566;border-bottom:2px dashed #E3B566;padding:8px 0;display:flex;flex-direction:column;gap:6px;text-align:left}
.iv-row{display:flex;gap:10px;font-size:12px;line-height:1.5}.iv-row span{flex:0 0 86px;color:#8A6A4E}.iv-row b{flex:1}
.iv-sign{font-size:11px;color:#8A6A4E;margin-top:10px;text-align:right}
.iv-stamp{position:absolute;right:14px;top:38%;border:4px solid #D9483B;color:#D9483B;border-radius:8px;padding:6px 10px;transform:rotate(-14deg) scale(2.4);opacity:0;animation:stampIn .35s cubic-bezier(.3,1.6,.5,1) forwards;display:flex;flex-direction:column;align-items:center;background:rgba(255,248,230,.85)}
.iv-stamp b{font-size:18px;letter-spacing:.12em}.iv-stamp small{font-size:9px}
@keyframes stampIn{to{transform:rotate(-14deg) scale(1);opacity:1}}
.iv-ticket{width:92%;display:flex;background:#FFD45E;color:#4A2E1B;border-radius:8px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.35);animation:ivUp .8s .25s cubic-bezier(.2,.8,.2,1) both;transform:rotate(1.5deg)}
.tk-l{flex:1;padding:9px 12px;display:flex;flex-direction:column;gap:2px;text-align:left}.tk-l small{font-size:9px;color:#7A5A2E}.tk-l b{font-size:13px}
.tk-r{width:70px;border-left:3px dashed #B8862E;display:flex;flex-direction:column;align-items:center;justify-content:center}.tk-r b{font-size:17px;color:#9A2A22}.tk-r small{font-size:9px}
.iv-btn,.op-cta{width:92%;height:54px;font-size:17px;animation:ivUp .8s .45s cubic-bezier(.2,.8,.2,1) both}
/* creator */
.cr{position:absolute;inset:0;overflow-y:auto;background:linear-gradient(#CFE7F2 0,#EAF4F8 230px,#FBEDDB 231px);animation:opIn .5s both}
.cr-head{text-align:center;padding:16px 0 0;display:flex;flex-direction:column;gap:3px}.cr-head small{font-size:10px;letter-spacing:.2em;color:#2E7D4F}.cr-head b{font-size:18px}
.cr-stage{position:relative;height:200px;display:flex;align-items:flex-end;justify-content:center}
.cr-stage::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(90deg,#FFFFFF 0 18px,#F1F6F9 18px 36px);border-top:3px solid #fff}
.cr-pv{position:relative;width:170px;height:170px;margin-bottom:6px;z-index:1}
.cr-spr{width:100%;height:100%;background-size:400% 1200%;image-rendering:auto;transition:transform .2s}
.cr-shadow{position:absolute;bottom:14px;left:50%;width:70px;height:14px;margin-left:-35px;border-radius:50%;background:rgba(40,30,15,.18)}
.cr-turn,.cr-pose{position:absolute;bottom:56px;z-index:2;height:36px;border-radius:999px;border:3px solid var(--brown);background:var(--cream);box-shadow:0 3px 0 var(--dark);font-size:12px;font-weight:700;padding:0 12px}
.cr-turn{left:14px;width:40px;padding:0;font-size:18px}.cr-pose{right:14px}
.cr-panel{margin:10px 12px 0;padding:12px;display:flex;flex-direction:column;gap:8px}
.cr-name{height:44px;font-size:16px}
.cr-tabs{display:flex;gap:6px;margin-top:4px}
.cr-tab{flex:1;height:38px;border-radius:10px;border:3px solid var(--brown);background:var(--paper);font-weight:700;font-size:13px}
.cr-tab.on{background:var(--yellow);box-shadow:0 3px 0 var(--dark)}
.cr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cr-th{position:relative;border:3px solid #C9A97E;border-radius:12px;background:#fff;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;transition:transform .12s}
.cr-th:active{transform:scale(.95)}
.cr-th.on{border-color:var(--brown);background:#FFF3C4;box-shadow:0 3px 0 var(--dark)}
.cr-th-img{width:72px;height:72px;background-size:400% 1200%;background-position:0 0}
.cr-th span{font-size:10px;line-height:1.3;text-align:center}
.cr-rank{display:flex;gap:6px;align-items:center;font-size:11px;min-height:0}
.cr-rank:empty{display:none}
.cr-rk{width:38px;height:34px;border-radius:8px;border:3px solid var(--brown);font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.cr-rk.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--brown)}
.cr-foot{padding:14px 16px 28px}
.cr-go{width:100%;height:56px;font-size:18px}
/* ticket */
.tk-wrap{position:relative;z-index:2;width:min(92vw,380px);display:flex;flex-direction:column;align-items:center}
.tk{position:relative;width:100%;display:flex;background:#FFF8E6;color:#4A2E1B;border-radius:10px;box-shadow:0 16px 36px rgba(0,0,0,.45);animation:ivUp .7s cubic-bezier(.2,.8,.2,1) both;margin-bottom:18px;transition:transform .7s cubic-bezier(.6,0,.3,1),opacity .7s}
.tk-main{position:relative;flex:1;padding:12px 14px;border-right:3px dashed #C9A97E;display:flex;flex-direction:column;gap:9px;background:linear-gradient(#D9483B 0 34px,transparent 34px);border-radius:10px 0 0 10px}
.tk-brand{display:flex;justify-content:space-between;align-items:center;color:#FFF8E6;margin:-4px 0 0}.tk-brand b{font-size:11px;letter-spacing:.1em}.tk-brand small{font-size:9px}
.tk-route{display:flex;align-items:center;gap:6px;margin-top:4px}.tk-route>div:not(.tk-arrow){display:flex;flex-direction:column}.tk-route small,.tk-meta small{font-size:8px;color:#8A6A4E;letter-spacing:.1em}.tk-route b{font-size:14px}
.tk-arrow{font-size:18px;flex:0 0 auto;animation:tramBob 1s ease-in-out infinite}
@keyframes tramBob{50%{transform:translateX(4px)}}
.tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.tk-meta div{display:flex;flex-direction:column}.tk-meta b{font-size:12px}
.tk-hero{width:120px;height:120px;background-size:400% 1200%;margin-bottom:4px;animation:popIn .6s cubic-bezier(.3,1.6,.5,1) both}
.tk-stub{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px}.tk-stub small{font-size:8px;letter-spacing:.1em}
.tk-bar{width:44px;height:54px;background:repeating-linear-gradient(90deg,#4A2E1B 0 2px,transparent 2px 4px,#4A2E1B 4px 5px,transparent 5px 8px)}
.tk-hole{position:absolute;top:12px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#151B44;transform:scale(0)}
.tk.punched .tk-hole{animation:punch .25s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes punch{to{transform:scale(1)}}
.tk.punched{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tk.fly{transform:translateY(-120vh) rotate(-18deg);opacity:0}
/* cutscene */
.op-cut{background:#000}
.cut-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cut-bars{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 70px 50px -30px rgba(0,0,0,.7),inset 0 -120px 70px -40px rgba(0,0,0,.75)}
.cut-cap{position:absolute;left:18px;right:18px;bottom:14%;text-align:center;font-size:16px;line-height:1.7;font-weight:700;white-space:pre-line;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8)}
.cut-cap.big{font-size:26px;letter-spacing:.06em;color:#FFD45E}
.cut-skip{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;font-size:12px}
.op-cut.out{animation:fadeW .45s forwards}
@keyframes fadeW{to{opacity:0}}
/* guide */
.guide{position:absolute;inset:0;z-index:9000;background:rgba(20,14,8,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 12px 22px;animation:opIn .3s both}
.gd-card{width:100%;max-width:420px;padding:18px 16px 14px;text-align:center;animation:ivUp .45s cubic-bezier(.2,.8,.2,1) both}
.gd-ic{width:72px;height:72px;margin:-52px auto 4px;border-radius:50%;background:#FFF3D6;border:4px solid var(--brown);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 4px 0 var(--dark)}
.gd-ic img{width:48px;height:48px;object-fit:contain}
.gd-step{font-size:10px;color:var(--muted)}
.gd-card h2{font-size:17px;margin:4px 0 6px}
.gd-card p{font-size:12.5px;line-height:1.8;white-space:pre-line;margin:0 0 10px}
.gd-dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}.gd-dots i{width:7px;height:7px;border-radius:50%;background:#D8C3A0}.gd-dots i.on{background:var(--red);width:18px;border-radius:4px}
.gd-btns{display:flex;gap:8px}.gd-btns button{flex:1;height:46px;font-size:14px}
@media (prefers-reduced-motion:reduce){.op-snow i,.env,.op-tap,.tk-arrow{animation:none!important}}
/* ===== BOARD ===== */
.bdv{position:absolute;inset:0;z-index:45;background:rgba(28,18,10,.94);display:flex;flex-direction:column;animation:opIn .25s both}
.bd-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}
.bd-back{padding:6px 12px;font-size:12px;font-weight:700}
.bd-title{text-align:center;color:#FFF8E6;display:flex;flex-direction:column}.bd-title small{font-size:9px;letter-spacing:.3em;color:#FFD45E}.bd-title b{font-size:17px}
.bd-frame{flex:1;margin:0 10px;overflow-y:auto;border:14px solid #8B5A2B;border-image:none;border-radius:10px;box-shadow:inset 0 0 0 3px #5A3A1A,0 6px 0 #3E2716;background-color:#C98A4C;background-image:radial-gradient(rgba(110,60,20,.35) 1px,transparent 1.6px),radial-gradient(rgba(255,226,180,.35) 1px,transparent 1.6px),radial-gradient(rgba(90,45,15,.2) 2px,transparent 2.6px);background-size:7px 7px,11px 11px,23px 23px;background-position:0 0,4px 5px,9px 3px}
.bd-area{position:relative;min-height:100%}
.bd-empty{position:absolute;left:0;right:0;top:40%;text-align:center;white-space:pre-line;color:#5A3A22;font-weight:700;font-size:13px;text-shadow:0 1px 0 #F3D9B0}

  delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot({includeMetadataChanges:false},s=>n(wrapSnap(s)),err=>{console.warn('snap',path,err);e&&e({code:'unavailable',message:String(err)});}),

function tick(dt){if(!SC)return;let vx=0,vy=0;
  const frozen=modalOpen()||S.editRoom||S.seat||S.hang||(S.wseat!=null);
  if(!frozen){if(!typing()){if(keys['arrowleft']||keys['a'])vx-=1;if(keys['arrowright']||keys['d'])vx+=1;if(keys['arrowup']||keys['w'])vy-=1;if(keys['arrowdown']||keys['s'])vy+=1;}

    if(SC.walkable(nx,ny)){P.x=nx;P.y=ny;}else if(SC.walkable(nx,P.y)){P.x=nx;}else if(SC.walkable(P.x,ny)){P.y=ny;}else if(P.path){P.path=null;}

  setAvaPos(P.el,P.x,P.y);P.el.classList.toggle('walk',P.moving);P.el.classList.toggle('flip',P.dir<0);

function findPath(sx,sy,tx,ty){const C=SC.cell,cols=Math.ceil(SC.w/C),rows=Math.ceil(SC.h/C);const free=(c,r)=>c>=0&&r>=0&&c<cols&&r<rows&&SC.walkable(c*C+C/2,r*C+C/2);

function jos(w,a,b){const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b);}
function bqSentence(f){const ks=(f||[]).filter(k=>BQF.some(x=>x[0]===k));if(!ks.length)return '';const cnt={};ks.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const u=BQF.filter(x=>cnt[x[0]]).sort((a,b)=>cnt[b[0]]-cnt[a[0]]||BQF.indexOf(a)-BQF.indexOf(b));const kw=x=>x[4],cl=x=>x[5];
  if(u.length===1){const x=u[0],n=cnt[x[0]];return n===1?cl(x)+'.':n===2?jos(kw(x),'을','를')+' 두 배로 담았어. '+cl(x)+'!':kw(x)+'만 한가득. '+cl(x)+', 진심으로 진심이야!';}

  return kw(u[0])+', '+kw(u[1])+', '+jos(kw(u[2]),'을','를')+' 한 다발에. '+cl(u[0])+'. '+cl(u[1])+'. '+cl(u[2])+'.';}

// manitto: frozen once in shared meta doc (fallback: deterministic derangement)
function maniCycle(res){const order=res.slice().sort((a,b)=>hashN(a+'p7x')-hashN(b+'p7x')||(a<b?-1:1));const pairs={};order.forEach((u,i)=>{pairs[u]=order[(i+1)%order.length];});return pairs;}
function maniValid(p){const g=Object.keys(p);const r=Object.values(p);return g.length>1&&g.every(u=>p[u]&&p[u]!==u)&&new Set(r).size===r.length&&r.every(u=>u in p);}
async function manittoOf(uid){const res=residents().map(r=>r[0]);if(res.length<2)return null;let pairs=null;const live=S.db&&!S.solo&&!isTest();
  if(live){try{const snap=await S.db.doc(NS+'meta/manitto').get();if(snap&&snap.exists){const d=snap.data();if(d&&d.pairs&&maniValid(d.pairs))pairs=d.pairs;}}catch(e){}}
  let dirty=false;
  if(!pairs){pairs=maniCycle(res);dirty=true;}
  else{res.forEach(u=>{if(!(u in pairs)){const gs=Object.keys(pairs).sort((a,b)=>hashN(a+u)-hashN(b+u));const g=gs[0];const t=pairs[g];pairs[g]=u;pairs[u]=t;dirty=true;}});}
  if(!maniValid(pairs)){pairs=maniCycle(res);dirty=true;}
  if(dirty&&live){try{await S.db.doc(NS+'meta/manitto').set({pairs,ts:Date.now()});}catch(e){}}
  const t=pairs[uid];if(t&&uid===myId()&&S.me&&S.me.mani!==t)saveMe({mani:t});return t||null;}
